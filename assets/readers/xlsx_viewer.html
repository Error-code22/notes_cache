<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none';">
  <title>Spreadsheet</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; background: #f5f5f3; color: #17181a; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    #status { padding: 32px 20px; text-align: center; color: #5f6368; font-size: 14px; }
    #sheet-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 10px 0; position: sticky; top: 0; background: #f5f5f3; z-index: 2; }
    .sheet-tab { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 8px 14px; background: #e7e7e3; color: #333; font-size: 13px; }
    .sheet-tab.active { background: #ffc53d; color: #111214; font-weight: 600; }
    #output { padding: 10px 8px 28px; overflow: auto; }
    #output table { border-collapse: collapse; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.10); }
    #output td, #output th { border: 1px solid #ddd; padding: 6px 9px; font-size: 12px; vertical-align: top; min-width: 54px; }
    #output th { background: #f0f0eb; font-weight: 600; }
    .foluma-error { margin: 24px; padding: 18px; border-radius: 14px; background: #fff3f0; color: #9b2c1f; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="status">Opening document...</div>
  <div id="sheet-tabs" hidden></div>
  <div id="output"></div>

  <script src="xlsx.full.min.js"></script>
  <script src="data.js"></script>
  <script>
    (function () {
      function notify(message) {
        try { window.Foluma && window.Foluma.postMessage(message); } catch (_) {}
      }
      function fail(error) {
        var status = document.getElementById('status');
        if (status) status.remove();
        document.getElementById('output').innerHTML = '<div class="foluma-error"><strong>Could not render this spreadsheet.</strong><br><br>' +
          String(error || 'Unknown error').replace(/[<>&]/g, function (c) {
            return {'<': '&lt;', '>': '&gt;', '&': '&amp;'}[c];
          }) + '<br><br>Use â€œOpen withâ€ or â€œBasic text editâ€ on the toolbar.</div>';
        notify('error:' + String(error || 'Unknown error'));
      }
      window.addEventListener('error', function (event) {
        if (event && event.message) fail(event.message);
      });
      try {
        var bytes = folumaBytes();
        var workbook = XLSX.read(bytes, { type: 'array', cellDates: false, cellNF: true });
        var names = workbook.SheetNames || [];
        if (!names.length) throw new Error('This workbook has no sheets.');
        var tabs = document.getElementById('sheet-tabs');
        var output = document.getElementById('output');
        var current = 0;
        function show(index) {
          current = index;
          var title = names[index];
          output.innerHTML = XLSX.utils.sheet_to_html(workbook.Sheets[title], { editable: false });
          Array.prototype.forEach.call(tabs.children, function (tab, i) {
            tab.className = 'sheet-tab' + (i === index ? ' active' : '');
          });
        }
        names.forEach(function (name, index) {
          var tab = document.createElement('button');
          tab.className = 'sheet-tab';
          tab.textContent = name;
          tab.addEventListener('click', function () { show(index); });
          tabs.appendChild(tab);
        });
        tabs.hidden = names.length < 2;
        show(0);
        var status = document.getElementById('status');
        if (status) status.remove();
        notify('ready');
      } catch (e) {
        fail(e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
